<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>life-world · 观测台</title>
<style>
/* 设计计划：
   配色：深空墨蓝底 + 青绿主调 + 琥珀强调，紫青星云只做氛围；语义色只给状态。
   字体：系统无衬线正文 + 等宽数字/标签，离线可用。
   布局：左侧主视区（星图 → 印象墙 → 检索/日记 → 日志），右侧 340px 控制栏；<1080px 单列。 */
:root{
  --bg:#05070d; --bg-2:#080c14;
  --panel:rgba(15,21,32,.74); --panel-2:rgba(20,28,42,.55); --panel-solid:#0d131d;
  --line:rgba(126,168,206,.14); --line-strong:rgba(126,168,206,.28);
  --fg:#e8eef8; --muted:#8ea0b6; --faint:#65758a;
  --accent:#5eead4; --accent-2:#fbbf24;
  --accent-soft:rgba(94,234,212,.12); --accent-glow:rgba(94,234,212,.22);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --bad:#fb7185; --bad-soft:rgba(251,113,133,.14);
  --radius:14px; --radius-sm:9px;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
  --shadow:0 22px 55px rgba(0,0,0,.38);
  --aurora-1:rgba(45,212,191,.15); --aurora-2:rgba(129,90,220,.15);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#eef2f6; --bg-2:#e6ecf2;
    --panel:rgba(255,255,255,.8); --panel-2:rgba(255,255,255,.62); --panel-solid:#fff;
    --line:rgba(30,58,80,.12); --line-strong:rgba(30,58,80,.24);
    --fg:#101827; --muted:#5a6b7d; --faint:#7b8a9a;
    --accent:#0f766e; --accent-2:#b45309;
    --accent-soft:rgba(15,118,110,.1); --accent-glow:rgba(15,118,110,.16);
    --ok:#15803d; --ok-soft:rgba(21,128,61,.1);
    --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
    --bad:#b91c1c; --bad-soft:rgba(185,28,28,.1);
    --shadow:0 18px 45px rgba(30,58,80,.1);
    --aurora-1:rgba(15,118,110,.1); --aurora-2:rgba(109,80,190,.1);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef2f6; --bg-2:#e6ecf2;
  --panel:rgba(255,255,255,.8); --panel-2:rgba(255,255,255,.62); --panel-solid:#fff;
  --line:rgba(30,58,80,.12); --line-strong:rgba(30,58,80,.24);
  --fg:#101827; --muted:#5a6b7d; --faint:#7b8a9a;
  --accent:#0f766e; --accent-2:#b45309;
  --accent-soft:rgba(15,118,110,.1); --accent-glow:rgba(15,118,110,.16);
  --ok:#15803d; --ok-soft:rgba(21,128,61,.1);
  --warn:#b45309; --warn-soft:rgba(180,83,9,.1);
  --bad:#b91c1c; --bad-soft:rgba(185,28,28,.1);
  --shadow:0 18px 45px rgba(30,58,80,.1);
  --aurora-1:rgba(15,118,110,.1); --aurora-2:rgba(109,80,190,.1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:14px;line-height:1.55;
  min-height:100vh;
  padding-block:0 48px;
  padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));
  background-image:
    radial-gradient(950px 520px at 12% -12%,var(--aurora-1),transparent 62%),
    radial-gradient(760px 460px at 92% -4%,var(--aurora-2),transparent 66%);
  background-attachment:fixed;
}
.wrap{max-width:1460px;margin:0 auto}

/* —— 顶栏 —— */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:26px 18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{position:relative;width:36px;height:36px;border-radius:11px;flex:none;
  background:conic-gradient(from 210deg,var(--accent),#7c5cff,var(--accent-2),var(--accent));
  box-shadow:0 0 26px var(--accent-glow)}
.mark::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg);
  box-shadow:inset 0 0 12px rgba(255,255,255,.08)}
h1{font-size:20px;line-height:1.15;margin:0;font-weight:650;letter-spacing:.02em}
.sub{color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel-2);backdrop-filter:blur(10px)}
.tab-btn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 14px;
  border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.tab-btn:hover{color:var(--fg)}
.tab-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.tab-panel[hidden]{display:none}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;
  background:var(--panel);backdrop-filter:blur(12px)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 10px var(--bad)}

/* —— 骨架 —— */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dash.memory{grid-template-columns:minmax(0,1fr)}
#tab-memory #graph{height:clamp(460px,62vh,720px)}
@media (max-width:1080px){.dash{grid-template-columns:1fr}}
main,.rail{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1080px){.rail{order:2}}
section{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);min-width:0}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.sec-note{font-size:12px;color:var(--faint)}
.spacer{flex:1}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--faint);margin-top:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.row-2{grid-template-columns:1fr}}
#tab-memory .row-2{align-items:stretch}
#tab-memory .row-2 > section{display:flex;flex-direction:column;height:540px}
#tab-memory .row-2 .results{flex:1;max-height:none;min-height:0}
#tab-memory .row-2 .day-wrap{flex:1;min-height:0}
#tab-memory .row-2 .day-wrap pre.log{height:100%;max-height:none}
#tab-memory .row-2 .dates{max-height:100%}
@media (max-width:900px){
  #tab-memory .row-2 > section{height:auto;min-height:0}
  #tab-memory .row-2 .results{max-height:420px}
  #tab-memory .row-2 .day-wrap{flex:none;min-height:0}
  #tab-memory .row-2 .day-wrap pre.log{height:360px;max-height:360px;overflow:auto}
  #tab-memory .row-2 .dates{max-height:180px}
}

/* —— 控件 —— */
button{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:6px 11px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:disabled{opacity:.55;cursor:progress}
button.primary{background:linear-gradient(180deg,var(--accent),color-mix(in oklab,var(--accent) 78%,#0b3b36));
  border-color:transparent;color:#04211d;font-weight:650}
button.ghost{background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],select{font:inherit;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:8px 10px;min-width:0}
input[type=search]::placeholder{color:var(--faint)}
label.field{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:0}
label.field select{flex:1;min-width:0}
label.field.compact{flex:1;min-width:130px}
label.field input.time{width:78px}
label.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
input[type=checkbox]{accent-color:var(--accent)}

/* —— 会话 —— */
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;background:var(--panel-2);min-width:0}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .name{font-weight:650;font-family:var(--mono);font-size:12px}
.card .age{color:var(--faint);font-size:11px;margin-left:auto}
.model{font-family:var(--mono);font-size:11px;color:var(--accent);word-break:break-all;margin-top:3px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.actions button{font-size:11px;padding:3px 8px}

/* —— AI 日程 —— */
.schedule{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.sched-item{border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:var(--radius-sm);
  padding:9px 10px;background:var(--panel-2);min-width:0}
.sched-item.due{border-left-color:var(--warn);background:var(--warn-soft)}
.sched-time{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:13px}
.sched-time .day{font-size:10px;color:var(--muted);letter-spacing:.04em}
.sched-note{font-size:12.5px;line-height:1.55;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.sched-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px;font-size:10.5px;color:var(--faint)}
.sched-meta .m{font-family:var(--mono);color:var(--accent)}

/* —— 用量 —— */
.tiles{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;background:var(--panel-2);min-width:0}
.tile .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.tile .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;margin-top:1px}
.tile .n{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:6px;height:86px;padding-top:4px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.bar .b{background:linear-gradient(180deg,var(--accent),color-mix(in oklab,var(--accent) 45%,transparent));
  border-radius:4px 4px 0 0;min-height:2px}
.bar.zero .b{width:6px;margin:0 auto;opacity:.3}
.bar .d{font-size:9px;color:var(--faint);text-align:center;font-family:var(--mono)}

/* —— 星图 —— */
.star{padding:0;overflow:hidden;background:linear-gradient(180deg,rgba(17,23,35,.9),rgba(8,11,18,.96))}
.star>.sec-head{padding:16px 16px 10px;margin:0}
.star .sec-head h2{color:#9fb3c8}
.star .sec-note{color:#6f8299}
.brain-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 12px;
  border-top:1px solid rgba(126,168,206,.12);border-bottom:1px solid rgba(126,168,206,.12);
  color:#a9b4c2;font-size:12px;background:rgba(8,12,19,.55)}
.brain-stats{display:flex;gap:13px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.brain-stats b{color:#e6e9ee;font-weight:600}
.brain-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}
.brain-tools input{flex:1;min-width:150px;background:rgba(6,10,17,.8);border:1px solid rgba(126,168,206,.18);
  color:#e6e9ee;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
.brain-tools button{background:rgba(6,10,17,.8);border:1px solid rgba(126,168,206,.2);color:#dbe4ee;font-size:12px;padding:5px 9px}
.bf{display:inline-flex;align-items:center;gap:4px;color:#a9b4c2;font-size:11px}
.bf input{accent-color:#5eead4;flex:none;width:13px;min-width:0}
.brain-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
#graph{position:relative;height:clamp(420px,56vh,620px);min-width:0;cursor:grab;background:#04060c;overflow:hidden}
#graph:active{cursor:grabbing}
#graph canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.brain-detail{border-left:1px solid rgba(126,168,206,.14);padding:13px;color:#c8d2de;
  font-size:12.5px;overflow:auto;max-height:620px;background:rgba(7,10,17,.45)}
.brain-detail h4{margin:0 0 8px;color:#5eead4;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.brain-detail .txt{white-space:pre-wrap;word-break:break-word;line-height:1.65}
.brain-detail .meta{color:#8b95a3;font-size:11px;font-family:var(--mono);margin-top:10px;
  display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){
  .brain-wrap{grid-template-columns:1fr}
  .brain-detail{border-left:0;border-top:1px solid rgba(126,168,206,.14);max-height:220px}
  #graph{height:400px}
}
.star:fullscreen{display:flex;flex-direction:column;background:#04060c;border:0;border-radius:0;height:100vh;overflow:hidden}
.star:fullscreen .brain-wrap{flex:1;min-height:0}
.star:fullscreen #graph{height:100%}
.star:fullscreen .brain-detail{max-height:none;width:300px;height:100%}
.star.is-full{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;
  background:#04060c;border:0;border-radius:0;height:100vh;overflow:hidden}
.star.is-full .brain-wrap{flex:1;min-height:0}
.star.is-full #graph{height:100%}
.star.is-full .brain-detail{max-height:none;width:300px;height:100%}
#tab-memory #star-shell:fullscreen #graph,
#tab-memory #star-shell.is-full #graph{height:100%!important}

/* —— 印象 —— */
.imp-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.imp-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 12px;
  background:var(--panel-2);min-width:0;border-left:2px solid var(--accent-2)}
.imp-card .subj{font-family:var(--mono);font-size:11px;color:var(--accent)}
.imp-card .body{margin-top:6px;line-height:1.62;font-size:13px}
.imp-card .meta{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5}
.imp-card .conf{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;margin-right:6px}
.conf-high{background:var(--ok-soft);color:var(--ok)}
.conf-mid{background:var(--warn-soft);color:var(--warn)}
.conf-low{background:var(--panel-solid);color:var(--muted);border:1px solid var(--line)}

/* —— 检索 / 日记 / 日志 —— */
.results{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
.results li{border-left:2px solid var(--accent);padding:6px 10px;background:var(--panel-2);
  border-radius:0 8px 8px 0;min-width:0}
.results .meta{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.results .txt{white-space:pre-wrap;word-break:break-word;font-size:13px}
.day-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
@media (max-width:620px){.day-wrap{grid-template-columns:1fr}}
.dates{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto}
.dates button{text-align:left;font-family:var(--mono);font-size:11px;padding:4px 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dates button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
pre.log{margin:0;max-height:320px;overflow:auto;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px;font-family:var(--mono);font-size:12px;
  white-space:pre-wrap;word-break:break-word}
.log-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.log-tools select{font-size:12px;padding:4px 8px}
.log-tools button{font-size:12px;padding:4px 9px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>life-world</h1>
        <div class="sub">记忆 · 会话 · 观测台</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="看板分区">
      <button class="tab-btn active" data-tab="overview" role="tab" aria-selected="true">概览</button>
      <button class="tab-btn" data-tab="memory" role="tab" aria-selected="false">记忆</button>
    </nav>
    <div class="top-right">
      <span class="pill" id="heartbeat"><span class="dot" id="hb-dot"></span><span id="hb-text">连接中…</span></span>
      <button id="theme" class="ghost" title="切换主题">主题</button>
    </div>
  </header>
  <div class="tab-panel" id="tab-overview">
    <div class="dash">
      <main>
        <section>
        <div class="sec-head"><h2>会话</h2><span class="spacer"></span><span class="sec-note">5s 心跳</span></div>
        <div class="sessions" id="sessions"><div class="muted">加载中…</div></div>
      </section>
        <section>
        <div class="sec-head"><h2>用量 · 7 天</h2></div>
        <div class="tiles" id="tiles"></div>
        <div class="bars" id="bars"></div>
        <div class="hint" id="usage-hint"></div>
      </section>
        <section>
          <div class="sec-head"><h2>AI 日程</h2><span class="spacer"></span><span class="sec-note" id="schedule-count">…</span></div>
          <div class="schedule" id="schedule"><div class="muted">加载中…</div></div>
          <div class="hint">来自 plan_next 的闹钟；随机想起不在这里。</div>
        </section>
      </main>
      <aside class="rail">
        <section>
        <div class="sec-head"><h2>模型</h2></div>
        <label class="field">本地<select id="m-local"></select></label>
        <label class="field" style="margin-top:8px">在线<select id="m-cloud"></select></label>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="m-save">保存</button>
          <span class="muted" id="m-hint"></span>
        </div>
        <div class="hint">改完保存，重启或切一次模型后生效。</div>
      </section>
        <section>
        <div class="sec-head"><h2>主动关怀</h2></div>
        <label class="check"><input type="checkbox" id="care-random">随机想起</label>
        <div class="row">
          <label class="field compact">安静开始<input type="search" id="care-qs" class="time" placeholder="23:30"></label>
          <label class="field compact">结束<input type="search" id="care-qe" class="time" placeholder="08:00"></label>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="primary" id="care-save">保存</button>
          <span class="muted" id="care-hint"></span>
        </div>
        <div class="hint">关掉随机想起 = 全天不主动找你，闹钟和晨间唤醒不受影响。</div>
      </section>
      </aside>
    </div>
  </div>

  <div class="tab-panel" id="tab-memory" hidden>
    <div class="dash memory">
      <main>
        <section class="star" id="star-shell">
        <div class="sec-head">
          <h2>记忆星图</h2>
          <span class="sec-note">拖拽旋转 · 滚轮缩放 · 点星看原文 · 亮白星=注入文档</span>
        </div>
        <div class="brain-bar">
          <div class="brain-stats" id="brain-stats">加载中…</div>
          <div class="brain-tools">
            <label class="bf"><input type="checkbox" id="f-mem" checked>记忆</label>
            <label class="bf"><input type="checkbox" id="f-diary" checked>日记</label>
            <label class="bf"><input type="checkbox" id="f-imp" checked>印象</label>
            <label class="bf"><input type="checkbox" id="f-doc" checked>文档</label>

<script>
const $ = (id) => document.getElementById(id)
const fmt = (n) => { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(2) + "M"; if (n >= 1e3) return (n / 1e3).toFixed(1) + "k"; return String(Math.round(n)) }
const ageText = (iso) => { const ms = Date.now() - Date.parse(iso); if (!Number.isFinite(ms)) return "?"; if (ms < 15000) return "刚刚"; if (ms < 60000) return Math.round(ms / 1000) + "s 前"; return Math.round(ms / 60000) + "m 前" }
const dayOfLocal = (d = new Date()) => {
  const p = (n) => String(n).padStart(2, "0")
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
}
const pad2 = (n) => String(n).padStart(2, "0")
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches
let FEATURES = { impressions: false }
let impressionsLoaded = false

function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t)
  else document.documentElement.removeAttribute("data-theme")
}
try { const saved = localStorage.getItem("lw-theme"); if (saved) applyTheme(saved) } catch {}
$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme")
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark"
  applyTheme(next || null)
  try { next ? localStorage.setItem("lw-theme", next) : localStorage.removeItem("lw-theme") } catch {}
}

async function getJson(url, opts) {
  const r = await fetch(url, opts)
  if (!r.ok) throw new Error((await r.text()) || r.status)
  return r.json()
}

async function loadOverview() {
  try {
    const d = await getJson("/api/overview")
    FEATURES = d.features || { impressions: true }
    const impSec = $("impressions-section")
    if (impSec) impSec.style.display = FEATURES.impressions ? "" : "none"
    if (FEATURES.impressions && !impressionsLoaded) { impressionsLoaded = true; loadImpressions() }
    $("hb-dot").className = "dot"
    $("hb-text").textContent = `在线 · ${d.sessions.length} 个会话`
    renderSessions(d.sessions, d.models)
    if (!careTouched) {
      $("care-random").checked = d.care?.randomEnabled !== false
      $("care-qs").value = d.care?.quietStart || ""
      $("care-qe").value = d.care?.quietEnd || ""
    }
    if (!mTouched) {
      fillSelect($("m-local"), d.models.local || "", d.available || [], "（不设置）")
      fillSelect($("m-cloud"), d.models.cloud || "", d.available || [], "（不设置）")
    }
    renderUsage(d.usage)
    renderSchedule(d.schedule || [])
    $("backup-hint").textContent = d.backup ? `快照 ${d.backup.size} · ${d.backup.last[0] || "无"}` : ""
  } catch {
    $("hb-dot").className = "dot off"
    $("hb-text").textContent = "服务未连接"
  }
}

function renderSessions(list, models) {
  const el = $("sessions")
  if (!list.length) { el.innerHTML = '<div class="muted">没有活跃会话。先起 pi / QQ 桥接 / 家会话。</div>'; return }
  el.innerHTML = ""
  for (const s of list) {
    const card = document.createElement("div")
    card.className = "card"
    const top = document.createElement("div"); top.className = "top"
    const name = document.createElement("span"); name.className = "name"; name.textContent = s.roleKey
    const age = document.createElement("span"); age.className = "age"; age.textContent = ageText(s.updated)
    top.append(name, age)
    const model = document.createElement("div"); model.className = "model"; model.textContent = s.model || "（未就绪）"
    const act = document.createElement("div"); act.className = "actions"
    const mk = (label, value) => {
      const b = document.createElement("button"); b.textContent = label
      b.onclick = async () => {
        b.disabled = true; b.textContent = "切换中…"
        try { const r = await getJson("/api/model", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target: s.roleKey, value }) }); b.textContent = r.ok ? "已切换" : "失败" }
        catch { b.textContent = "失败" }
        setTimeout(loadOverview, 1200)
      }
      return b
    }
    if (models?.local) act.append(mk("本地", "local"))
    if (models?.cloud) act.append(mk("在线", "cloud"))
    if (s.roleKey === "qq" || s.roleKey === "home" || String(s.roleKey).startsWith("group-")) {
      const rb = document.createElement("button")
      rb.textContent = "重启"
      rb.title = s.roleKey === "home" ? "重启家会话" : "重启 QQ 桥接（私聊与群会话一起重连）"
      rb.onclick = async () => {
        if (!confirm(`重启 ${s.roleKey}？会话会断开重连。`)) return
        rb.disabled = true; rb.textContent = "重启中…"
        try {
          const r = await getJson("/api/restart", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ target: s.roleKey }) })
          rb.textContent = r.ok ? "已重启" : "失败"
        } catch { rb.textContent = "失败" }
        setTimeout(loadOverview, 2500)
      }
      act.append(rb)
    }
    if (!act.childElementCount) act.append(Object.assign(document.createElement("span"), { className: "muted", textContent: "未配置模型" }))
    card.append(top, model, act)
    el.append(card)
  }
}

function fmtDuration(ms) {
  const m = Math.max(0, Math.round(ms / 60000))
  if (m < 60) return `${m} 分钟`
  const h = Math.floor(m / 60), mm = m % 60
  if (h < 24) return `${h} 小时${mm ? ` ${mm} 分` : ""}`
  const d = Math.floor(h / 24), hh = h % 24
  return `${d} 天${hh ? ` ${hh} 小时` : ""}`
}

function renderSchedule(list) {
  const el = $("schedule"), cnt = $("schedule-count")
  const rows = Array.isArray(list) ? list : []
  cnt.textContent = rows.length ? `${rows.length} 条` : "无"
  if (!rows.length) { el.innerHTML = '<div class="muted">暂无日程；等 AI 用 plan_next 排。</div>'; return }
  el.innerHTML = ""
  const now = Date.now()
  for (const a of rows) {
    const at = Date.parse(a.at)
    if (!Number.isFinite(at)) continue
    const d = new Date(at)
    const day = dayOfLocal(d)
    const today = dayOfLocal()
    const tomorrow = dayOfLocal(new Date(now + 86_400_000))
    const dayLabel = day === today ? "今天" : day === tomorrow ? "明天" : day.slice(5)
    const diff = at - now
    const due = diff <= 0
    const rel = due ? (diff > -60_000 ? "已到点" : `逾期 ${fmtDuration(-diff)}`) : `还有 ${fmtDuration(diff)}`
    const model = a.model === "local" ? "本地模型" : a.model === "cloud" ? "在线模型" : (a.model || "当前模型")
    const item = document.createElement("div")
    item.className = "sched-item" + (due ? " due" : "")
    const time = document.createElement("div"); time.className = "sched-time"
    const hm = document.createElement("span"); hm.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`
    const dayEl = document.createElement("span"); dayEl.className = "day"; dayEl.textContent = dayLabel
    time.append(hm, dayEl)
    const note = document.createElement("div"); note.className = "sched-note"; note.textContent = a.note || "（没有备注）"
    const meta = document.createElement("div"); meta.className = "sched-meta"
    const m1 = document.createElement("span"); m1.className = "m"; m1.textContent = model
    const m2 = document.createElement("span"); m2.textContent = rel
    meta.append(m1, m2)
    item.append(time, note, meta)
    el.append(item)
  }
}

function renderUsage(u) {  if (!u) return
  const t = u.total
  $("tiles").innerHTML = `
    <div class="tile"><div class="k">请求</div><div class="v">${t.req}</div><div class="n">${u.days} 天</div></div>
    <div class="tile"><div class="k">输入 tokens</div><div class="v">${fmt(t.input)}</div><div class="n">缓存读 ${fmt(t.cacheRead)}</div></div>
    <div class="tile"><div class="k">输出 tokens</div><div class="v">${fmt(t.output)}</div><div class="n">模型切换 ${u.switches} 次</div></div>
    <div class="tile"><div class="k">费用</div><div class="v">${t.cost ? "$" + t.cost.toFixed(4) : "-"}</div><div class="n">云端 ${t.cloud} / 本地 ${t.local}</div></div>`
  const list = Array.isArray(u.list) ? u.list : []
  const byDay = new Map(list.map((r) => [r.day, r]))
  const days = []
  for (let i = 6; i >= 0; i--) {
    const day = dayOfLocal(new Date(Date.now() - i * 86_400_000))
    days.push(byDay.get(day) || { day, input: 0, output: 0, cacheRead: 0, cost: 0, req: 0, cloud: 0, local: 0 })
  }
  const max = Math.max(1, ...days.map((r) => r.input + r.output))
  $("bars").innerHTML = days.map((r) => {
    const h = Math.round(((r.input + r.output) / max) * 100)
    return `<div class="bar${r.input + r.output ? "" : " zero"}" title="${r.day} · ${fmt(r.input + r.output)} tokens"><div class="b" style="height:${h}%"></div><div class="d">${r.day.slice(5)}</div></div>`
  }).join("")
  $("usage-hint").textContent = `云端 ${t.cloud} 次 · 本地 ${t.local} 次 · 切换 ${u.switches} 次`
}

function fillSelect(el, current, list, noneLabel) {
  const seen = new Set()
  el.innerHTML = ""
  const none = document.createElement("option")
  none.value = ""; none.textContent = noneLabel; el.append(none); seen.add("")
  if (current) {
    const o = document.createElement("option")
    o.value = current; o.textContent = current + "（当前）"; el.append(o); seen.add(current)
  }
  for (const m of list) {
    if (seen.has(m.ref)) continue
    const o = document.createElement("option")
    o.value = m.ref; o.textContent = m.ref; el.append(o)
  }
  el.value = current || ""
}

const bgImage = new Image()

bgImage.onload = () => {
  const W = 1600, H = 900
  bgCanvas.width = W; bgCanvas.height = H

  const s = Math.max(W / bgImage.width, H / bgImage.height) * 1.12

// 星图雾气：中心浓、外侧薄，像真正的星云气团
const fogCanvas = document.createElement("canvas")
function buildFog() {
  const S = 640
  fogCanvas.width = S; fogCanvas.height = S
  const c = fogCanvas.getContext("2d")
  c.clearRect(0, 0, S, S)
  c.globalCompositeOperation = "lighter"
  let seed = 20261108
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 }
  const colors = [[80, 200, 220], [130, 110, 230], [70, 120, 220], [240, 190, 120], [90, 180, 200], [170, 140, 240], [60, 160, 180]]
  const blob = (x, y, r, col, alpha) => {
    const g = c.createRadialGradient(x, y, 0, x, y, r)
    g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha})`)
    g.addColorStop(0.55, `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.45})`)
    g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`)
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill()
  }
  for (let i = 0; i < 48; i++) {
    const a = rnd() * Math.PI * 2
    const rad = Math.sqrt(rnd()) * S * 0.44
    blob(S / 2 + Math.cos(a) * rad, S / 2 + Math.sin(a) * rad, S * (0.06 + rnd() * 0.16), colors[i % colors.length], 0.05 + rnd() * 0.08)
  }
  for (let i = 0; i < 22; i++) {
    const a = rnd() * Math.PI * 2
    const rad = Math.sqrt(rnd()) * S * 0.38
    blob(S / 2 + Math.cos(a) * rad, S / 2 + Math.sin(a) * rad, S * (0.03 + rnd() * 0.07), colors[(i + 2) % colors.length], 0.04 + rnd() * 0.06)
  }
  // 条状云带，让气团有层次
  for (let i = 0; i < 9; i++) {
    const a = rnd() * Math.PI * 2
    const rad = Math.sqrt(rnd()) * S * 0.36
    const x = S / 2 + Math.cos(a) * rad
    const y = S / 2 + Math.sin(a) * rad
    const r = S * (0.14 + rnd() * 0.2)
    const col = colors[i % colors.length]
    const alpha = 0.04 + rnd() * 0.05
    c.save(); c.translate(x, y); c.rotate(rnd() * Math.PI); c.scale(1, 0.3)
    const g = c.createRadialGradient(0, 0, 0, 0, 0, r)
    g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha})`)
    g.addColorStop(0.6, `rgba(${col[0]},${col[1]},${col[2]},${alpha * 0.4})`)
    g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`)
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.restore()
  }
  c.globalCompositeOperation = "destination-in"
  const mask = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2)
  mask.addColorStop(0, "rgba(0,0,0,1)")
  mask.addColorStop(0.5, "rgba(0,0,0,.62)")
  mask.addColorStop(1, "rgba(0,0,0,0)")
  c.fillStyle = mask; c.fillRect(0, 0, S, S)
}
buildFog()

// 星云云团：分形噪声生成有絮状边缘的云块，叠在柔焦雾之上
const cloudCanvas = document.createElement("canvas")
function buildClouds() {
  const S = 384
  cloudCanvas.width = S; cloudCanvas.height = S
  const c = cloudCanvas.getContext("2d")

    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {

      g.addColorStop(0.2, "rgba(235,250,255,.7)")
      g.addColorStop(0.55, "rgba(130,200,255,.22)")
      g.addColorStop(1, "rgba(120,180,255,0)")
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, gr, 0, Math.PI * 2); ctx.fill()
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.7, 0, Math.PI * 2); ctx.fill()
      ctx.strokeStyle = "rgba(200,240,255,.45)"; ctx.lineWidth = 1
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.45, 0, Math.PI * 2); ctx.stroke()
      if (hit) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2
        ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2); ctx.stroke()
      }
    } else {
      ctx.fillStyle = hit ? "#ffffff" : nodeColor(node)
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill()
      if (hit) {
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1
        ctx.beginPath(); ctx.arc(p.x, p.y, r + 2.5, 0, Math.PI * 2); ctx.stroke()
      }
    }
    if (BRAIN.hover === node.id) {
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 1.5
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2); ctx.stroke()
    }
    const showLabel = BRAIN.hover === node.id || node.kind === "impression" || hit || BRAIN.selected === node.id || (node.kind !== "identity" && BRAIN.zoom > 1.25 && labels < 48 && (node.kind === "diary" || (node.score || 0) > 0.2))
    if (showLabel && !queryDim) {
      labels++
      const text = node.kind === "identity" ? node.subject : node.kind === "impression" ? `印象·${node.subject}` : node.kind === "diary" ? `日记 ${String(node.t).slice(5, 10)}` : String(node.content).slice(0, 18)
      ctx.font = node.kind === "identity" ? "600 11px system-ui,sans-serif" : node.kind === "impression" ? "600 11px system-ui,sans-serif" : "10px system-ui,sans-serif"
      let lx = p.x, ly = p.y - r - 6
      if (node.kind === "identity") {
        const dx = p.x - w / 2, dy = p.y - h / 2
        const len = Math.hypot(dx, dy) || 1
        lx = p.x + (dx / len) * (r * 1.9 + 8)
        ly = p.y + (dy / len) * (r * 1.9 + 8)
        ctx.textAlign = dx < 0 ? "right" : "left"
      } else if (node.kind === "impression") {
        const dx = p.x - w / 2, dy = p.y - h / 2
        const len = Math.hypot(dx, dy) || 1
        lx = p.x + (dx / len) * (r * 2.2 + 10)
        ly = p.y + (dy / len) * (r * 2.2 + 10)
        ctx.textAlign = dx < 0 ? "right" : "left"
      } else ctx.textAlign = "center"
      if (node.kind === "identity") {
        const tw = ctx.measureText(text).width
        const bx = ctx.textAlign === "right" ? lx - tw - 6 : lx - 6
        const by = ly - 13
        ctx.fillStyle = "rgba(4,8,16,.78)"
        ctx.beginPath()
        if (ctx.roundRect) ctx.roundRect(bx, by, tw + 12, 18, 6)
        else ctx.rect(bx, by, tw + 12, 18)
        ctx.fill()
        ctx.strokeStyle = "rgba(190,235,255,.28)"; ctx.lineWidth = 1; ctx.stroke()
      }
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(5,6,11,.85)"; ctx.strokeText(text, lx, ly)
      ctx.fillStyle = node.kind === "identity" ? "#dff8ff" : node.kind === "impression" ? "#fde68a" : node.kind === "diary" ? "#fbbf24" : "#cbd5e1"
      ctx.fillText(text, lx, ly)
    }
    ctx.globalAlpha = 1
  }
  drawIdentityLinks(ctx, idx, proj, focus, focusMix, t)
  BRAIN.proj = proj
}

let lastFrame = 0
function brainLoop(t) {
  const ts = t || 0
  const dt = lastFrame ? Math.min(50, Math.max(0, ts - lastFrame)) : 16.67
  lastFrame = ts
  const k = dt / 16.67
  const memoryHidden = $("tab-memory")?.hidden
  if (document.hidden || memoryHidden) { requestAnimationFrame(brainLoop); return }
  if (Math.min(2, window.devicePixelRatio || 1) !== BRAIN.dpr) resizeBrain()
  if (!BRAIN.drag && !reduceMotion) BRAIN.yaw += (BRAIN.hover ? 0.00025 : 0.0012) * k
  BRAIN.dt = k
  if (reduceMotion && !BRAIN.dirty && !BRAIN.drag && !BRAIN.hover && BRAIN.focusMix < 0.01) {
    requestAnimationFrame(brainLoop)
    return
  }
  BRAIN.dirty = false
  drawBrain(ts)
  requestAnimationFrame(brainLoop)
}

let detailSeq = 0
let brainLoadSeq = 0
function showBrainDetail(n) {
  const seq = ++detailSeq
  const el = $("brain-detail")
  if (n.kind === "identity") {
    el.innerHTML = `<h4>注入文档 · ${esc2(n.subject)}</h4><div class="txt">${esc2(n.content)}</div><div class="meta"><span>文件：${esc2(n.file || "")}</span><span>更新：${esc2(new Date(n.t).toLocaleString("zh-CN"))}</span></div>`
  } else if (n.kind === "impression") {
    el.innerHTML = `<h4>印象 · ${esc2(n.subject)}</h4><div class="txt">${esc2(n.content)}</div><div class="meta"><span>${esc2(n.meta || "")}</span></div>`
  } else if (n.kind === "diary") {
    el.innerHTML = `<h4>日记 ${esc2(n.subject)}</h4><div class="txt">${esc2(n.content)}</div>`
  } else {
    el.innerHTML = `<h4>记忆节点</h4><div class="txt">${esc2(n.content)}</div><div class="meta"><span>时间：${esc2(new Date(n.t).toLocaleString("zh-CN"))}</span><span>角色：${n.role === "user" ? "对方" : "我"}</span><span>激活：${n.activation}</span><span>命中：${n.hits} 次 · 关联：${n.degree} 条</span></div>`
  }
  if (!n.kind || n.kind === "identity" || n.kind === "diary") {
    getJson("/api/node?id=" + encodeURIComponent(n.id)).then((d) => {
      if (seq !== detailSeq || !d || typeof d.content !== "string") return
      const txt = el.querySelector(".txt")
      if (txt) txt.textContent = d.content
    }).catch(() => {})
  }
  BRAIN.dirty = true
}

function hitBrain(x, y) {
  let best = null, bd = 15
  BRAIN.nodes.forEach((node, i) => {
    if (!nodeVisible(node) || !BRAIN.proj[i]) return
    const p = BRAIN.proj[i], d = Math.hypot(p.x - x, p.y - y)
    if (d < bd) { bd = d; best = node }
  })
  return best
}

brainCanvas.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return
  POINTERS.set(e.pointerId, { x: e.clientX, y: e.clientY })
  try { brainCanvas.setPointerCapture(e.pointerId) } catch {}
  if (POINTERS.size === 2) {
    const [a, b] = [...POINTERS.values()]
    BRAIN.pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: BRAIN.zoom }
    BRAIN.drag = null
    BRAIN.hover = null
    BRAIN.dirty = true
    return
  }
  BRAIN.hover = null
  BRAIN.drag = { x: e.clientX, y: e.clientY, moved: 0 }
  BRAIN.dirty = true
})
brainCanvas.addEventListener("pointermove", (e) => {
  if (POINTERS.has(e.pointerId)) POINTERS.set(e.pointerId, { x: e.clientX, y: e.clientY })
  if (BRAIN.pinch && POINTERS.size >= 2) {
    const [a, b] = [...POINTERS.values()]
    const d = Math.hypot(a.x - b.x, a.y - b.y)
    if (d > 0) BRAIN.zoom = Math.max(0.45, Math.min(3.2, BRAIN.pinch.zoom * d / BRAIN.pinch.dist))
    BRAIN.dirty = true
    return
  }
  if (!BRAIN.drag) {
    const rect = brainCanvas.getBoundingClientRect()
    const n = hitBrain(e.clientX - rect.left, e.clientY - rect.top)
    const id = n ? n.id : null
    if (BRAIN.hover !== id) {
      BRAIN.hover = id
      brainCanvas.style.cursor = id ? "pointer" : "grab"
      BRAIN.dirty = true
    }
    return
  }
  const dx = e.clientX - BRAIN.drag.x, dy = e.clientY - BRAIN.drag.y
  BRAIN.drag.moved += Math.abs(dx) + Math.abs(dy)
  BRAIN.drag.x = e.clientX; BRAIN.drag.y = e.clientY
  BRAIN.yaw += dx * 0.006
  BRAIN.pitch = Math.max(-1.2, Math.min(1.2, BRAIN.pitch + dy * 0.006))
  BRAIN.dirty = true
})
brainCanvas.addEventListener("pointerleave", () => {
  BRAIN.hover = null
  brainCanvas.style.cursor = "grab"
  BRAIN.dirty = true
})
brainCanvas.addEventListener("pointerup", (e) => {
  const wasPinch = !!BRAIN.pinch
  const d = BRAIN.drag
  POINTERS.delete(e.pointerId)
  if (BRAIN.pinch && POINTERS.size < 2) BRAIN.pinch = null
  BRAIN.drag = null
  BRAIN.dirty = true
  if (wasPinch || !d || d.moved > 6) return
  const rect = brainCanvas.getBoundingClientRect()
  const n = hitBrain(e.clientX - rect.left, e.clientY - rect.top)
  if (n) { BRAIN.selected = n.id; showBrainDetail(n); burstFrom(n.id) }
})
function clearPointer(e) {
  POINTERS.delete(e.pointerId)
  BRAIN.drag = null
  if (POINTERS.size < 2) BRAIN.pinch = null
  brainCanvas.style.cursor = "grab"
  BRAIN.dirty = true
}
brainCanvas.addEventListener("pointercancel", clearPointer)
brainCanvas.addEventListener("lostpointercapture", clearPointer)
window.addEventListener("blur", () => {
  POINTERS.clear()
  BRAIN.drag = null
  BRAIN.pinch = null
  brainCanvas.style.cursor = "grab"
  BRAIN.dirty = true
})
brainCanvas.addEventListener("wheel", (e) => {
  e.preventDefault()
  BRAIN.zoom = Math.max(0.45, Math.min(3.2, BRAIN.zoom * (e.deltaY > 0 ? 0.92 : 1.08)))
  BRAIN.dirty = true
}, { passive: false })

// 全屏
const starShell = $("star-shell")
function fullscreenNow() {
  return document.fullscreenElement === starShell || starShell.classList.contains("is-full")
}
function syncFullLabel() { $("star-full").textContent = fullscreenNow() ? "退出全屏" : "全屏" }
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) { await document.exitFullscreen(); return }
    if (starShell.classList.contains("is-full")) { starShell.classList.remove("is-full"); return }
    if (starShell.requestFullscreen) { await starShell.requestFullscreen(); return }
    starShell.classList.add("is-full")
  } catch {
    starShell.classList.toggle("is-full")
  } finally {
    setTimeout(() => { resizeBrain(); syncFullLabel() }, 80)
  }
}
$("star-full").onclick = toggleFullscreen
document.addEventListener("fullscreenchange", () => { setTimeout(() => { resizeBrain(); syncFullLabel() }, 80) })
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && starShell.classList.contains("is-full")) {
    starShell.classList.remove("is-full"); resizeBrain(); syncFullLabel()
  }
})
syncFullLabel()

function toggleFilter() {
  BRAIN.filters = { mem: $("f-mem").checked, diary: $("f-diary").checked, imp: $("f-imp").checked, doc: $("f-doc").checked }
  if (BRAIN.hover) {
    const n = BRAIN.nodes.find((x) => x.id === BRAIN.hover)
    if (!n || !nodeVisible(n)) BRAIN.hover = null
  }
  BRAIN.dirty = true
}
for (const id of ["f-mem", "f-diary", "f-imp", "f-doc"]) $(id).addEventListener("change", toggleFilter)

async function loadBrain() {
  const seq = ++brainLoadSeq
  try {
    const d = await getJson("/api/memory-graph?limit=400")
    if (seq !== brainLoadSeq) return
    const st = d.stats || {}
    $("brain-stats").innerHTML = `<span>节点 <b>${st.nodes ?? 0}</b></span><span>联想边 <b>${st.edges ?? 0}</b></span><span>今日命中 <b>${st.todayAccess ?? 0}</b></span><span>展示 <b>${st.shown ?? 0}</b></span><span>文档 <b>${st.docs ?? 0}</b></span><span>印象 <b>${st.impressions ?? 0}</b></span>`
    BRAIN.nodes = d.nodes
    BRAIN.links = d.links
    BRAIN.selected = null
    BRAIN.hover = null
    BRAIN.focusMix = 0
    BRAIN.focusIds = null
    PULSES.length = 0
    detailSeq++
    $("brain-detail").innerHTML = '<h4>节点详情</h4><div class="txt">点一颗记忆球看原文、激活度与关联。</div>'
    BRAIN.dirty = true
    layoutBrain()
    resizeBrain()
  } catch (e) { $("brain-stats").textContent = "加载失败：" + e.message }
}
$("brain-q").addEventListener("input", () => { BRAIN.search = $("brain-q").value.trim().toLowerCase(); BRAIN.dirty = true })
$("brain-refresh").onclick = loadBrain

if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(() => resizeBrain()).observe($("graph"))
}
window.addEventListener("resize", resizeBrain)
requestAnimationFrame(brainLoop)

async function loadImpressions() {
  try {
    const d = await getJson("/api/impressions")
    const el = $("imp-list"); el.innerHTML = ""
    if (!d.items || !d.items.length) { el.innerHTML = '<div class="muted">还没有印象；等 05:00 或点「立即整理」。</div>'; return }
    for (const it of d.items) {
      const conf = /置信度：\s*(高|中|低)/.exec(it.meta || "")
      const cls = conf ? (conf[1] === "高" ? "conf-high" : conf[1] === "中" ? "conf-mid" : "conf-low") : "conf-low"
      const card = document.createElement("div"); card.className = "imp-card"
      card.innerHTML = `<div class="subj">[${esc2(it.subject)}]</div><div class="body">${esc2(it.text)}</div>
        <div class="meta">${conf ? `<span class="conf ${cls}">${esc2(conf[1])}</span>` : ""}${esc2(it.meta || "")}</div>`
      el.append(card)
    }
  } catch (e) { $("imp-list").textContent = "加载失败：" + e.message }
}
$("imp-run").onclick = async () => {
  const b = $("imp-run"); b.disabled = true; b.textContent = "已下发…"
  try {
    const r = await getJson("/api/impressions/run", { method: "POST" })
    $("imp-hint").textContent = r.ok ? "已触发，几分钟后刷新" : (r.msg || "失败")
  } catch (e) { $("imp-hint").textContent = "失败：" + e.message }
  setTimeout(() => { b.disabled = false; b.textContent = "立即整理"; loadImpressions(); loadBrain() }, 4000)
}

const TAB_IDS = ["overview", "memory"]
function setTab(name, remember = true) {
  if (!TAB_IDS.includes(name)) name = "overview"
  for (const id of TAB_IDS) {
    const panel = $("tab-" + id)
    const btn = document.querySelector(`.tab-btn[data-tab="${id}"]`)
    const on = id === name
    if (panel) panel.hidden = !on
    if (btn) {
      btn.classList.toggle("active", on)
      btn.setAttribute("aria-selected", on ? "true" : "false")
    }
  }
  if (remember) { try { localStorage.setItem("lw-tab", name) } catch {} }
  if (name === "memory") {
    BRAIN.dirty = true
    setTimeout(() => { resizeBrain(); drawBrain(performance.now()) }, 80)
  }
}
document.querySelectorAll(".tab-btn").forEach((btn) => { btn.onclick = () => setTab(btn.dataset.tab) })
try { setTab(localStorage.getItem("lw-tab") || "overview", false) } catch { setTab("overview", false) }

loadOverview(); loadDates(); loadLog(); loadBrain(); loadDay(dayOfLocal())
setInterval(loadOverview, 10000)
setInterval(loadLog, 15000)
</script>
