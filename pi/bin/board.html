<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>life-world 控制台</title>
<style>
/* 设计计划：
   配色：冷灰底 + 青绿强调（控制台/仪表），语义色只给状态；
   字体：系统无衬线 + 等宽数字；
   布局：单列 1180px 容器，卡片分区，摘要先于细节。 */
:root{
  --bg:#f4f6f7; --panel:#ffffff; --panel-2:#fafbfc;
  --fg:#171b21; --muted:#5e6a78; --line:#dde3e9;
  --accent:#0f766e; --accent-soft:#e4f2ef;
  --ok:#15803d; --ok-soft:#e8f5ec; --warn:#b45309; --bad:#b91c1c;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --panel:#151a21; --panel-2:#11161c;
    --fg:#e6e9ee; --muted:#8b95a3; --line:#232b36;
    --accent:#2dd4bf; --accent-soft:#12312e;
    --ok:#4ade80; --ok-soft:#12251a; --warn:#fbbf24; --bad:#f87171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#151a21; --panel-2:#11161c;
  --fg:#e6e9ee; --muted:#8b95a3; --line:#232b36;
  --accent:#2dd4bf; --accent-soft:#12312e;
  --ok:#4ade80; --ok-soft:#12251a; --warn:#fbbf24; --bad:#f87171;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55;
  padding:24px max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 20px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--bad)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] button.primary{color:#062522}
section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 14px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel-2);min-width:0;
  display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .name{font-weight:600;font-family:var(--mono);font-size:13px}
.card .age{color:var(--muted);font-size:12px;margin-left:auto}
.model{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.actions button{font-size:12px;padding:3px 8px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .n{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-width:0}
.bar .b{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bar .d{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=search],select{font:inherit;color:inherit;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;min-width:0}
input[type=search]{flex:1;min-width:180px}
.field{display:flex;align-items:center;gap:8px;flex:1;min-width:220px;font-size:12px;color:var(--muted)}
.field select{flex:1;min-width:0}
.field input.time{width:76px}
.field input[type=checkbox]{accent-color:var(--accent)}
.results{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.results li{border-left:3px solid var(--line);padding:6px 10px;background:var(--panel-2);border-radius:0 8px 8px 0;min-width:0}
.results .meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.results .txt{white-space:pre-wrap;word-break:break-word}
.split{display:grid;gap:16px;grid-template-columns:minmax(160px,220px) minmax(0,1fr)}
.dates{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.dates button{text-align:left;font-family:var(--mono);font-size:12px}
.dates button.on{border-color:var(--accent);background:var(--accent-soft)}
pre.log{margin:12px 0 0;max-height:300px;overflow:auto;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:640px){ .split{grid-template-columns:1fr} .bars{height:90px} }

/* —— 记忆脑图 —— */
.brain{background:#06070c;border:1px solid #1a2330;border-radius:12px;overflow:hidden}
.brain-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1a2330;color:#a9b4c2;font-size:12px}
.brain-stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono)}
.brain-stats b{color:#e6e9ee;font-weight:600}
.brain-bar input{flex:1;min-width:140px;background:#0d1117;border:1px solid #223042;color:#e6e9ee;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
.brain-bar button{background:#0d1117;border:1px solid #223042;color:#dbe4ee}
.brain-wrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:460px}
#graph{height:520px;min-width:0;position:relative;cursor:grab}
#graph canvas{display:block;width:100%;height:100%;touch-action:none}
.bf{display:inline-flex;align-items:center;gap:4px;color:#a9b4c2;font-size:12px}
.bf input{accent-color:#2dd4bf;flex:none;width:14px;min-width:0}
.brain-detail{border-left:1px solid #1a2330;padding:12px;color:#c8d2de;font-size:13px;overflow:auto;max-height:520px}
.brain-detail h4{margin:0 0 8px;color:#2dd4bf;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.brain-detail .txt{white-space:pre-wrap;word-break:break-word;line-height:1.6}
.brain-detail .meta{color:#8b95a3;font-size:11px;font-family:var(--mono);margin-top:10px;display:flex;flex-direction:column;gap:4px}
.impressions{margin-top:16px}
.impressions h3{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.imp-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px}
.imp-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);min-width:0}
.imp-card .subj{font-family:var(--mono);font-size:12px;color:var(--accent)}
.imp-card .body{margin-top:6px;line-height:1.6}
.imp-card .meta{font-size:11px;color:var(--muted);margin-top:8px}
.imp-card .conf{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;margin-right:6px}
.conf-high{background:var(--ok-soft);color:var(--ok)}
.conf-mid{background:#fef3c7;color:#92400e}
.conf-low{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
@media (max-width:760px){ .brain-wrap{grid-template-columns:1fr} .brain-detail{border-left:0;border-top:1px solid #1a2330;max-height:220px} #graph{height:400px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>life-world</h1>
    <span class="sub">会话 · 记忆 · 用量</span>
    <span class="spacer"></span>
    <span class="pill" id="heartbeat"><span class="dot" id="hb-dot"></span><span id="hb-text">连接中…</span></span>
    <button id="theme" title="切换主题">主题</button>
  </header>

  <section>
    <h2>模型设置</h2>
    <div class="row">
      <label class="field">本地模型<select id="m-local"></select></label>
      <label class="field">在线模型<select id="m-cloud"></select></label>
      <button class="primary" id="m-save">保存</button>
      <span class="muted" id="m-hint"></span>
    </div>
    <div class="hint">改完保存，后续切换和重启会使用新值；正在跑的会话要切一次才生效。</div>
  </section>

  <section>
    <h2>主动关怀</h2>
    <div class="row">
      <label class="field"><input type="checkbox" id="care-random"> 随机想起</label>
      <label class="field">安静开始<input type="search" id="care-qs" class="time" placeholder="23:30"></label>
      <label class="field">安静结束<input type="search" id="care-qe" class="time" placeholder="08:00"></label>
      <button class="primary" id="care-save">保存</button>
      <span class="muted" id="care-hint"></span>
    </div>
    <div class="hint">关掉「随机想起」= 全天安静：不会主动找你，闹钟和早上唤醒不受影响。</div>
  </section>

  <section>
    <h2>会话</h2>
    <div class="grid" id="sessions"><div class="muted">加载中…</div></div>
    <div class="hint">切换模型会写 control.json，目标进程在 5 秒内响应；切到在线会同时打开该会话的机密抽屉。</div>
  </section>

  <section>
    <h2>用量（最近 7 天）</h2>
    <div class="tiles" id="tiles"></div>
    <div class="bars" id="bars"></div>
    <div class="hint" id="usage-hint"></div>
  </section>

  <section>
    <h2>记忆脑图</h2>
    <div class="brain">
      <div class="brain-bar">
        <div class="brain-stats" id="brain-stats">加载中…</div>
        <label class="bf"><input type="checkbox" id="f-mem" checked> 记忆</label>
        <label class="bf"><input type="checkbox" id="f-diary" checked> 日记</label>
        <label class="bf"><input type="checkbox" id="f-imp" checked> 印象</label>
        <input id="brain-q" placeholder="在图中搜索…">
        <button id="brain-refresh">刷新</button>
      </div>
      <div class="brain-wrap">
        <div id="graph"></div>
        <aside class="brain-detail" id="brain-detail">
          <h4>节点详情</h4>
          <div class="txt">点一颗记忆球看原文、激活度与关联。</div>
        </aside>
      </div>
    </div>
    <div class="impressions">
      <div class="row">
        <h3>印象</h3>
        <span class="spacer"></span>
        <button id="imp-run">立即整理</button>
        <span class="muted" id="imp-hint"></span>
      </div>
      <div class="imp-grid" id="imp-list"></div>
    </div>
  </section>

  <section>
    <h2>记忆检索</h2>
    <div class="row">
      <input type="search" id="q" placeholder="搜对话原文，例如：机密抽屉、法考、千问">
      <button class="primary" id="search">搜索</button>
    </div>
    <ul class="results" id="results"></ul>
  </section>

  <section>
    <h2>日记 / 某天</h2>
    <div class="split">
      <div class="dates" id="dates"></div>
      <div>
        <div class="row">
          <span class="muted" id="day-label">选一天</span>
          <span class="spacer"></span>
          <button id="today">今天</button>
        </div>
        <pre class="log" id="day-content">（左侧选一天，或点「今天」）</pre>
      </div>
    </div>
  </section>

  <section>
    <h2>日志</h2>
    <div class="row">
      <select id="log-target">
        <option value="qq">QQ 桥接</option>
        <option value="home">家会话</option>
        <option value="debug">调试</option>
      </select>
      <button id="log-refresh">刷新</button>
      <span class="spacer"></span>
      <button id="backup">打快照</button>
      <span class="muted" id="backup-hint"></span>
    </div>
    <pre class="log" id="log">（加载中…）</pre>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id)
const fmt = (n) => { n = Number(n) || 0; if (n >= 1e6) return (n/1e6).toFixed(2)+"M"; if (n >= 1e3) return (n/1e3).toFixed(1)+"k"; return String(Math.round(n)) }
const ageText = (iso) => { const ms = Date.now() - Date.parse(iso); if (!Number.isFinite(ms)) return "?"; if (ms < 15000) return "刚刚"; if (ms < 60000) return Math.round(ms/1000)+"s 前"; return Math.round(ms/60000)+"m 前" }

function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t)
  else document.documentElement.removeAttribute("data-theme")
}
try { const saved = localStorage.getItem("lw-theme"); if (saved) applyTheme(saved) } catch {}
$("theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme")
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark"
  applyTheme(next || null)
  try { next ? localStorage.setItem("lw-theme", next) : localStorage.removeItem("lw-theme") } catch {}
}

async function getJson(url, opts) {
  const r = await fetch(url, opts)
  if (!r.ok) throw new Error((await r.text()) || r.status)
  return r.json()
}

async function loadOverview() {
  try {
    const d = await getJson("/api/overview")
    $("hb-dot").className = "dot"
    $("hb-text").textContent = `在线 · ${d.sessions.length} 个会话`
    renderSessions(d.sessions, d.models)
    if (!careTouched) {
      $("care-random").checked = d.care?.randomEnabled !== false
      $("care-qs").value = d.care?.quietStart || ""
      $("care-qe").value = d.care?.quietEnd || ""
    }
    if (!mTouched) {
      fillSelect($("m-local"), d.models.local || "", d.available || [], "（不设置）")
      fillSelect($("m-cloud"), d.models.cloud || "", d.available || [], "（不设置）")
    }
    renderUsage(d.usage)
    $("backup-hint").textContent = d.backup ? `快照 ${d.backup.size} · ${d.backup.last[0] || "无"}` : ""
  } catch (e) {
    $("hb-dot").className = "dot off"
    $("hb-text").textContent = "服务未连接"
  }
}

function renderSessions(list, models) {
  const el = $("sessions")
  if (!list.length) { el.innerHTML = '<div class="muted">没有活跃会话。先起 pi / QQ 桥接 / 家会话。</div>'; return }
  el.innerHTML = ""
  for (const s of list) {
    const card = document.createElement("div")
    card.className = "card"
    const top = document.createElement("div"); top.className = "top"
    const name = document.createElement("span"); name.className = "name"; name.textContent = s.roleKey
    const age = document.createElement("span"); age.className = "age"; age.textContent = ageText(s.updated)
    top.append(name, age)
    const model = document.createElement("div"); model.className = "model"; model.textContent = s.model || "（未就绪）"
    const act = document.createElement("div"); act.className = "actions"
    const mk = (label, value) => {
      const b = document.createElement("button"); b.textContent = label
      b.onclick = async () => {
        b.disabled = true; b.textContent = "切换中…"
        try { const r = await getJson("/api/model", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ target: s.roleKey, value }) }); b.textContent = r.ok ? "已切换" : "失败" }
        catch { b.textContent = "失败" }
        setTimeout(loadOverview, 1200)
      }
      return b
    }
    act.append(mk("本地", "local"), mk("在线", "cloud"))
    card.append(top, model, act)
    el.append(card)
  }
}

function renderUsage(u) {
  if (!u) return
  const t = u.total
  $("tiles").innerHTML = `
    <div class="tile"><div class="k">请求</div><div class="v">${t.req}</div><div class="n">${u.days} 天</div></div>
    <div class="tile"><div class="k">输入 tokens</div><div class="v">${fmt(t.input)}</div><div class="n">缓存读 ${fmt(t.cacheRead)}</div></div>
    <div class="tile"><div class="k">输出 tokens</div><div class="v">${fmt(t.output)}</div><div class="n">模型切换 ${u.switches} 次</div></div>
    <div class="tile"><div class="k">费用</div><div class="v">${t.cost ? "$" + t.cost.toFixed(4) : "-"}</div><div class="n">云端 ${t.cloud} / 本地 ${t.local}</div></div>`
  const max = Math.max(1, ...u.list.map((r) => r.input + r.output))
  $("bars").innerHTML = u.list.map((r) => {
    const h = Math.round(((r.input + r.output) / max) * 100)
    return `<div class="bar" title="${r.day} · ${fmt(r.input + r.output)} tokens"><div class="b" style="height:${h}%"></div><div class="d">${r.day.slice(5)}</div></div>`
  }).join("") || '<div class="muted">最近没有用量</div>'
  $("usage-hint").textContent = `云端 ${t.cloud} 次 · 本地 ${t.local} 次 · 切换 ${u.switches} 次`
}

let careTouched = false
for (const id of ["care-qs","care-qe"]) $(id).addEventListener("input", () => { careTouched = true })
$("care-random").addEventListener("change", () => { careTouched = true })
$("care-save").onclick = async () => {
  const b = $("care-save"); b.disabled = true; b.textContent = "保存中…"
  try {
    const r = await getJson("/api/care", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({
      randomEnabled: $("care-random").checked,
      quietStart: $("care-qs").value.trim(),
      quietEnd: $("care-qe").value.trim(),
    }) })
    $("care-hint").textContent = r.ok ? "已保存" : (r.msg || "保存失败")
    careTouched = false
  } catch (e) { $("care-hint").textContent = "保存失败：" + e.message }
  b.disabled = false; b.textContent = "保存"
  setTimeout(() => { $("care-hint").textContent = "" }, 3000)
  loadOverview()
}

let mTouched = false
function fillSelect(el, current, list, noneLabel) {
  const seen = new Set()
  el.innerHTML = ""
  const none = document.createElement("option")
  none.value = ""; none.textContent = noneLabel; el.append(none); seen.add("")
  if (current) {
    const o = document.createElement("option")
    o.value = current; o.textContent = current + "（当前）"; el.append(o); seen.add(current)
  }
  for (const m of list) {
    if (seen.has(m.ref)) continue
    const o = document.createElement("option")
    o.value = m.ref; o.textContent = m.ref; el.append(o)
  }
  el.value = current || ""
}
$("m-local").addEventListener("change", () => { mTouched = true })
$("m-cloud").addEventListener("change", () => { mTouched = true })
$("m-save").onclick = async () => {
  const b = $("m-save"); b.disabled = true; b.textContent = "保存中…"
  try {
    const r = await getJson("/api/models", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ local: $("m-local").value.trim(), cloud: $("m-cloud").value.trim() }) })
    $("m-hint").textContent = r.ok ? "已保存" : "保存失败"
    mTouched = false
  } catch (e) { $("m-hint").textContent = "保存失败：" + e.message }
  b.disabled = false; b.textContent = "保存"
  setTimeout(() => { $("m-hint").textContent = "" }, 3000)
  loadOverview()
}

async function search() {
  const q = $("q").value.trim()
  const el = $("results")
  if (!q) { el.innerHTML = ""; return }
  el.innerHTML = '<li class="muted">搜索中…</li>'
  try {
    const d = await getJson("/api/memory?q=" + encodeURIComponent(q) + "&limit=20")
    el.innerHTML = ""
    if (!d.rows.length) { el.innerHTML = '<li class="muted">没有命中。</li>'; return }
    for (const r of d.rows) {
      const li = document.createElement("li")
      const meta = document.createElement("div"); meta.className = "meta"
      meta.textContent = `${new Date(r.t).toLocaleString("zh-CN")} · ${r.role === "user" ? "对方" : "我"}`
      const txt = document.createElement("div"); txt.className = "txt"; txt.textContent = r.text.slice(0, 500)
      li.append(meta, txt); el.append(li)
    }
  } catch (e) { el.innerHTML = '<li class="muted">搜索失败：' + e.message + '</li>' }
}
$("search").onclick = search
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search() })

async function loadDates() {
  try {
    const d = await getJson("/api/diary")
    const el = $("dates"); el.innerHTML = ""
    for (const item of d.list) {
      const b = document.createElement("button")
      b.textContent = `${item.date}${item.title ? " · " + item.title : ""}`
      b.onclick = () => loadDay(item.date, b)
      el.append(b)
    }
    if (!d.list.length) el.innerHTML = '<span class="muted">还没有日记。</span>'
  } catch {}
}
async function loadDay(date, btn) {
  document.querySelectorAll("#dates button").forEach((b) => b.classList.remove("on"))
  if (btn) btn.classList.add("on")
  $("day-label").textContent = date
  try {
    const d = await getJson("/api/day?date=" + encodeURIComponent(date))
    const parts = []
    if (d.diary) parts.push("—— 日记 ——\n" + d.diary)
    if (d.chat.length) parts.push("—— 对话 ——\n" + d.chat.map((r) => `[${new Date(r.t).toLocaleTimeString("zh-CN", {hour:"2-digit",minute:"2-digit"})} ${r.role === "user" ? "对方" : "我"}] ${r.text}`).join("\n"))
    $("day-content").textContent = parts.join("\n\n") || "这天没有记录。"
  } catch (e) { $("day-content").textContent = "读取失败：" + e.message }
}
$("today").onclick = () => loadDay(new Date().toISOString().slice(0, 10))

async function loadLog() {
  const target = $("log-target").value
  try {
    const d = await getJson(`/api/logs?target=${target}&n=120`)
    $("log").textContent = d.text || "（空）"
    $("log").scrollTop = $("log").scrollHeight
  } catch (e) { $("log").textContent = "读取失败：" + e.message }
}
$("log-refresh").onclick = loadLog
$("log-target").onchange = loadLog
$("backup").onclick = async () => {
  const b = $("backup"); b.disabled = true; b.textContent = "快照中…"
  try { const r = await getJson("/api/backup", { method: "POST" }); b.textContent = r.ok ? "已快照" : "失败" }
  catch { b.textContent = "失败" }
  setTimeout(() => { b.disabled = false; b.textContent = "打快照"; loadOverview() }, 1500)
}


// —— 记忆脑图（Canvas 3D）/ 印象 ——
const BRAIN = { nodes: [], links: [], pos: [], proj: [], yaw: 0.6, pitch: -0.25, zoom: 1, drag: null, selected: null, search: "", filters: { mem: true, diary: true, imp: true } }
const brainCanvas = document.createElement("canvas")
$("graph").appendChild(brainCanvas)
const bctx = brainCanvas.getContext("2d")
const stars = Array.from({ length: 220 }, (_, i) => ({ x: (i * 9301 + 49297) % 233280 / 233280, y: (i * 49297 + 233) % 233280 / 233280, a: 0.1 + ((i * 37) % 60) / 300 }))
function nodeColor(n) {
  if (n.kind === "impression") return "#fbbf24"
  if (n.kind === "diary") return "#f59e0b"
  return n.role === "user" ? "#4fc3f7" : "#2dd4bf"
}
function nodeVisible(n) {
  if (n.kind === "impression") return BRAIN.filters.imp
  if (n.kind === "diary") return BRAIN.filters.diary
  return BRAIN.filters.mem
}
function esc2(v) { const d = document.createElement("div"); d.textContent = String(v ?? ""); return d.innerHTML }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) } return h >>> 0 }
function layoutBrain() {
  const { nodes, links } = BRAIN
  const pos = new Map()
  nodes.forEach((n) => {
    const h = hashStr(n.id)
    const theta = ((h % 1000) / 1000) * Math.PI * 2
    const phi = (((h >> 10) % 1000) / 1000) * Math.PI
    const r = n.kind === "impression" ? 2.2 : n.kind === "diary" ? 5.5 : 9 + ((h >> 20) % 5)
    pos.set(n.id, { x: Math.cos(theta) * Math.sin(phi) * r, y: Math.cos(phi) * r, z: Math.sin(theta) * Math.sin(phi) * r })
  })
  // 印象固定在中心一圈，避免互相挤叠
  const imps = nodes.filter((n) => n.kind === "impression")
  imps.forEach((n, i) => {
    const a = (i / Math.max(1, imps.length)) * Math.PI * 2 - Math.PI / 2
    pos.set(n.id, { x: Math.cos(a) * 6.5, y: (i % 2 === 0 ? 2.2 : -2.2), z: Math.sin(a) * 6.5 })
  })
  const idx = new Map(nodes.map((n, i) => [n.id, i]))
  const arr = nodes.map((n) => pos.get(n.id))
  for (let it = 0; it < 55; it++) {
    const disp = arr.map(() => ({ x: 0, y: 0, z: 0 }))
    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
      let dx = arr[i].x - arr[j].x, dy = arr[i].y - arr[j].y, dz = arr[i].z - arr[j].z
      const d2 = dx * dx + dy * dy + dz * dz || 0.01
      if (d2 > 100) continue
      const f = 0.35 / d2
      dx *= f; dy *= f; dz *= f
      disp[i].x += dx; disp[i].y += dy; disp[i].z += dz
      disp[j].x -= dx; disp[j].y -= dy; disp[j].z -= dz
    }
    for (const l of links) {
      const a = idx.get(l.source), b = idx.get(l.target)
      if (a === undefined || b === undefined) continue
      let dx = arr[b].x - arr[a].x, dy = arr[b].y - arr[a].y, dz = arr[b].z - arr[a].z
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01
      const f = (d - 2.2) * (l.kind === "recall" ? 0.004 : 0.002)
      dx = dx / d * f; dy = dy / d * f; dz = dz / d * f
      disp[a].x += dx; disp[a].y += dy; disp[a].z += dz
      disp[b].x -= dx; disp[b].y -= dy; disp[b].z -= dz
    }
    for (let i = 0; i < arr.length; i++) {
      if (nodes[i].kind === "impression") continue
      arr[i].x = arr[i].x * 0.98 + disp[i].x
      arr[i].y = arr[i].y * 0.98 + disp[i].y
      arr[i].z = arr[i].z * 0.98 + disp[i].z
    }
  }
  BRAIN.pos = arr
}
function projectPoint(p, w, h) {
  const cy = Math.cos(BRAIN.yaw), sy = Math.sin(BRAIN.yaw)
  const cp = Math.cos(BRAIN.pitch), sp = Math.sin(BRAIN.pitch)
  const x1 = p.x * cy - p.z * sy
  const z1 = p.x * sy + p.z * cy
  const y1 = p.y * cp - z1 * sp
  const z2 = p.y * sp + z1 * cp
  const scale = 1 / (1 + z2 * 0.055)
  const k = 26 * scale * BRAIN.zoom
  return { x: w / 2 + x1 * k, y: h / 2 + y1 * k, z: z2, s: scale * BRAIN.zoom }
}
function resizeBrain() {
  const el = $("graph"), dpr = window.devicePixelRatio || 1
  brainCanvas.width = el.clientWidth * dpr; brainCanvas.height = el.clientHeight * dpr
  brainCanvas.style.width = el.clientWidth + "px"; brainCanvas.style.height = el.clientHeight + "px"
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0)
}
function drawBrain() {
  const el = $("graph"), w = el.clientWidth, h = el.clientHeight
  if (!w || !h) return
  const ctx = bctx
  ctx.clearRect(0, 0, w, h)
  const bg = ctx.createRadialGradient(w / 2, h / 2, 20, w / 2, h / 2, Math.max(w, h) * 0.7)
  bg.addColorStop(0, "#0b1020"); bg.addColorStop(1, "#05060b")
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h)
  for (const st of stars) { ctx.globalAlpha = st.a; ctx.fillStyle = "#9fb4c9"; ctx.fillRect(st.x * w, st.y * h, 1, 1) }
  ctx.globalAlpha = 1
  const idx = new Map(BRAIN.nodes.map((n, i) => [n.id, i]))
  const proj = BRAIN.pos.map((p) => projectPoint(p, w, h))
  const query = BRAIN.search
  // links
  for (const l of BRAIN.links) {
    const a = idx.get(l.source), b = idx.get(l.target)
    if (a === undefined || b === undefined) continue
    const na = BRAIN.nodes[a], nb = BRAIN.nodes[b]
    if (!nodeVisible(na) || !nodeVisible(nb)) continue
    const pa = proj[a], pb = proj[b]
    const depth = Math.max(0, Math.min(1, (pa.z + pb.z) / 24 + 0.5))
    let color
    if (l.kind === "impression") color = `rgba(251,191,36,${0.25 + (1 - depth) * 0.25})`
    else if (l.kind === "diary") color = `rgba(245,158,11,${0.1 + (1 - depth) * 0.15})`
    else color = `rgba(45,212,191,${0.08 + (1 - depth) * 0.12})`
    ctx.strokeStyle = color
    ctx.lineWidth = l.kind === "impression" ? 0.9 : 0.5
    if (l.kind === "impression") ctx.setLineDash([3, 4])
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke()
    ctx.setLineDash([])
  }
  // nodes far to near
  const order = BRAIN.nodes.map((n, i) => i).filter((i) => nodeVisible(BRAIN.nodes[i])).sort((a, b) => proj[b].z - proj[a].z)
  let labels = 0
  for (const i of order) {
    const n = BRAIN.nodes[i], p = proj[i]
    const hit = query && String(n.content).toLowerCase().includes(query)
    const dim = query && !hit
    const base = n.kind === "impression" ? 7 : n.kind === "diary" ? 4 : 1.8 + Math.min(3, (n.score || 0) * 2)
    const r = Math.max(1.2, base * p.s)
    ctx.globalAlpha = dim ? 0.18 : 1
    if (n.kind === "impression") {
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.6)
      g.addColorStop(0, "rgba(255,238,180,.95)"); g.addColorStop(0.45, "rgba(251,191,36,.55)"); g.addColorStop(1, "rgba(251,191,36,0)")
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill()
      ctx.strokeStyle = "rgba(253,230,138,.9)"; ctx.lineWidth = 1.2
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.7, 0, Math.PI * 2); ctx.stroke()
      ctx.fillStyle = "#fff3c4"; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.75, 0, Math.PI * 2); ctx.fill()
    } else if (n.kind === "diary") {
      ctx.fillStyle = "rgba(245,158,11,.85)"; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill()
      ctx.strokeStyle = "rgba(245,158,11,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, r * 1.8, 0, Math.PI * 2); ctx.stroke()
    } else {
      ctx.fillStyle = hit ? "#ffffff" : nodeColor(n)
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill()
      if (hit) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, r + 2.5, 0, Math.PI * 2); ctx.stroke() }
    }
    const showLabel = n.kind === "impression" || hit || BRAIN.selected === n.id || (BRAIN.zoom > 1.3 && labels < 40 && (n.kind === "diary" || (n.score || 0) > 0.25))
    if (showLabel && !dim) {
      labels++
      const text = n.kind === "impression" ? `印象·${n.subject}` : n.kind === "diary" ? `日记 ${String(n.t).slice(5, 10)}` : String(n.content).slice(0, 18)
      ctx.font = n.kind === "impression" ? "600 11px system-ui,sans-serif" : "10px system-ui,sans-serif"
      let lx = p.x, ly = p.y - r - 6
      if (n.kind === "impression") {
        const dx = p.x - w / 2, dy = p.y - h / 2
        const len = Math.hypot(dx, dy) || 1
        lx = p.x + (dx / len) * (r * 2.2 + 10)
        ly = p.y + (dy / len) * (r * 2.2 + 10)
        ctx.textAlign = dx < 0 ? "right" : "left"
      } else { ctx.textAlign = "center" }
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(5,6,11,.85)"; ctx.strokeText(text, lx, ly)
      ctx.fillStyle = n.kind === "impression" ? "#fde68a" : n.kind === "diary" ? "#fbbf24" : "#cbd5e1"
      ctx.fillText(text, lx, ly)
    }
    ctx.globalAlpha = 1
  }
  BRAIN.proj = proj
}
function brainLoop() { if (!BRAIN.drag) BRAIN.yaw += 0.0014; drawBrain(); requestAnimationFrame(brainLoop) }
function showBrainDetail(n) {
  const el = $("brain-detail")
  if (n.kind === "impression") {
    el.innerHTML = `<h4>印象 · ${esc2(n.subject)}</h4><div class="txt">${esc2(n.content)}</div><div class="meta"><span>${esc2(n.meta || "")}</span></div>`
  } else if (n.kind === "diary") {
    el.innerHTML = `<h4>日记 ${esc2(n.subject)}</h4><div class="txt">${esc2(n.content)}</div>`
  } else {
    el.innerHTML = `<h4>记忆节点</h4><div class="txt">${esc2(n.content)}</div><div class="meta"><span>时间：${esc2(new Date(n.t).toLocaleString("zh-CN"))}</span><span>角色：${n.role === "user" ? "对方" : "我"}</span><span>激活：${n.activation}</span><span>命中：${n.hits} 次 · 关联：${n.degree} 条</span></div>`
  }
}
function hitBrain(x, y) {
  let best = null, bd = 14
  BRAIN.nodes.forEach((n, i) => {
    if (!nodeVisible(n) || !BRAIN.proj[i]) return
    const p = BRAIN.proj[i], d = Math.hypot(p.x - x, p.y - y)
    if (d < bd) { bd = d; best = n }
  })
  return best
}
brainCanvas.addEventListener("pointerdown", (e) => { BRAIN.drag = { x: e.clientX, y: e.clientY, ox: e.clientX, oy: e.clientY, moved: 0 }; brainCanvas.setPointerCapture(e.pointerId) })
brainCanvas.addEventListener("pointermove", (e) => {
  if (!BRAIN.drag) return
  const dx = e.clientX - BRAIN.drag.x, dy = e.clientY - BRAIN.drag.y
  BRAIN.drag.moved += Math.abs(dx) + Math.abs(dy)
  BRAIN.drag.x = e.clientX; BRAIN.drag.y = e.clientY
  BRAIN.yaw += dx * 0.006; BRAIN.pitch = Math.max(-1.2, Math.min(1.2, BRAIN.pitch + dy * 0.006))
})
brainCanvas.addEventListener("pointerup", (e) => {
  const d = BRAIN.drag; BRAIN.drag = null
  if (!d || d.moved > 6) return
  const r = brainCanvas.getBoundingClientRect()
  const n = hitBrain(e.clientX - r.left, e.clientY - r.top)
  if (n) { BRAIN.selected = n.id; showBrainDetail(n) }
})
brainCanvas.addEventListener("wheel", (e) => { e.preventDefault(); BRAIN.zoom = Math.max(0.45, Math.min(3.2, BRAIN.zoom * (e.deltaY > 0 ? 0.92 : 1.08))) }, { passive: false })
function toggleFilter() {
  BRAIN.filters = { mem: $("f-mem").checked, diary: $("f-diary").checked, imp: $("f-imp").checked }
}
for (const id of ["f-mem", "f-diary", "f-imp"]) $(id).addEventListener("change", toggleFilter)
async function loadBrain() {
  try {
    const d = await getJson("/api/memory-graph?limit=400")
    const st = d.stats || {}
    $("brain-stats").innerHTML = `<span>节点 <b>${st.nodes ?? 0}</b></span><span>联想边 <b>${st.edges ?? 0}</b></span><span>今日命中 <b>${st.todayAccess ?? 0}</b></span><span>展示 <b>${st.shown ?? 0}</b></span><span>印象 <b>${st.impressions ?? 0}</b></span>`
    BRAIN.nodes = d.nodes
    BRAIN.links = d.links
    layoutBrain()
    resizeBrain()
  } catch (e) { $("brain-stats").textContent = "加载失败：" + e.message }
}
$("brain-q").addEventListener("input", () => { BRAIN.search = $("brain-q").value.trim().toLowerCase() })
$("brain-refresh").onclick = loadBrain
window.addEventListener("resize", resizeBrain)
requestAnimationFrame(brainLoop)

async function loadImpressions() {
  try {
    const d = await getJson("/api/impressions")
    const el = $("imp-list"); el.innerHTML = ""
    if (!d.items || !d.items.length) { el.innerHTML = '<div class="muted">还没有印象；等 05:00 或点「立即整理」。</div>'; return }
    for (const it of d.items) {
      const conf = /置信度：\s*(高|中|低)/.exec(it.meta || "")
      const cls = conf ? (conf[1] === "高" ? "conf-high" : conf[1] === "中" ? "conf-mid" : "conf-low") : "conf-low"
      const card = document.createElement("div"); card.className = "imp-card"
      card.innerHTML = `<div class="subj">[${esc2(it.subject)}]</div><div class="body">${esc2(it.text)}</div>
        <div class="meta">${conf ? `<span class="conf ${cls}">${esc2(conf[1])}</span>` : ""}${esc2(it.meta || "")}</div>`
      el.append(card)
    }
  } catch (e) { $("imp-list").textContent = "加载失败：" + e.message }
}
$("imp-run").onclick = async () => {
  const b = $("imp-run"); b.disabled = true; b.textContent = "已下发…"
  try {
    const r = await getJson("/api/impressions/run", { method: "POST" })
    $("imp-hint").textContent = r.ok ? "已触发，几分钟后刷新" : (r.msg || "失败")
  } catch (e) { $("imp-hint").textContent = "失败：" + e.message }
  setTimeout(() => { b.disabled = false; b.textContent = "立即整理"; loadImpressions(); loadBrain() }, 4000)
}

loadOverview(); loadDates(); loadLog(); loadBrain(); loadImpressions(); loadDay(new Date().toISOString().slice(0, 10))
setInterval(loadOverview, 10000)
setInterval(loadLog, 15000)
</script>
